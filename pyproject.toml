[project]
name = "aei-web"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.1",
    "geopandas>=1.1.2",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 88
extend-exclude = ["frontend", "node_modules", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: the formatter enforces line length; remaining hits are prose strings/comments
ignore = ["E501"]
